name: CI Frontend

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'frontend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configura Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/react-vite-tanstack-ts/package-lock.json

      - name: Instala dependencias
        run: |
          cd frontend/react-vite-tanstack-ts
          npm install

      - name: Verifica build
        run: |
          cd frontend/react-vite-tanstack-ts
          npm run build
