<!DOCTYPE html>
<html>
<body>
  <input id="room" placeholder="Nome da sala" value="sala1">
  <input id="port" placeholder="Porta" value="8001">
  <input id="name" placeholder="Seu nome" value="Aninha">
  <button onclick="connect()">Conectar</button>
  <br><br>
  <input id="msg" placeholder="Digite uma mensagem">
  <button onclick="send()">Enviar</button>
  <hr>
  <div id="log"></div>
  <script>
    var ws;
    var myName;
    function connect() {
      myName = document.getElementById("name").value;
      const room = document.getElementById("room").value;
      const port = document.getElementById("port").value;
      ws = new WebSocket("ws://localhost:" + port + "/ws/" + room);
      ws.onmessage = function(e) {
        const isHistory = e.data.startsWith("[histórico]");
        const color = isHistory ? "gray" : "black";
        const style = isHistory ? "font-style:italic" : "font-weight:bold";
        document.getElementById("log").innerHTML += `<p style="color:${color};${style}">${e.data}</p>`;
      };
      ws.onopen = function() {
        document.getElementById("log").innerHTML += `<p><b>Conectado na sala ${document.getElementById("room").value} porta ${port}</b></p>`;
      };
    }
    function send() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        const msg = myName + ": " + document.getElementById("msg").value;
        ws.send(msg);
        document.getElementById("msg").value = "";
      } else {
        alert("Conecte primeiro!");
      }
    }
  </script>
</body>
</html>
