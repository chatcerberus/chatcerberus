<!DOCTYPE html>
<html>
<body>
  <input id="room" placeholder="Nome da sala" value="sala1">
  <input id="port" placeholder="Porta" value="8001">
  <button onclick="connect()">Conectar</button>
  <br><br>
  <input id="msg" placeholder="Digite uma mensagem">
  <button onclick="send()">Enviar</button>
  <div id="log"></div>
  <script>
    let ws;
    function connect() {
      const room = document.getElementById("room").value;
      const port = document.getElementById("port").value;
      ws = new WebSocket(`ws://localhost:${port}/ws/${room}`);
      ws.onmessage = e => document.getElementById("log").innerHTML += `<p>${e.data}</p>`;
      ws.onopen = () => document.getElementById("log").innerHTML += `<p><b>Conectado na porta ${port}</b></p>`;
    }
    function send() {
      ws.send(document.getElementById("msg").value);
    }
  </script>
</body>
</html>
